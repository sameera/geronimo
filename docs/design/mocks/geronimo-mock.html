<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geronimo mock (Phase 1)</title>
<style>
    /* Design tokens. Source of truth: docs/design/design-system.md */
    :root {
        color-scheme: light dark;

        /* Surfaces and text */
        --stage: light-dark(#dcd8ec, #06050d);
        --frame: light-dark(#1a1530, #000000);
        --bg: light-dark(#f4f2fb, #0d0b1a);
        --surface: light-dark(#ffffff, #17142a);
        --surface-2: light-dark(#f8f6ff, #201c38);
        --line: light-dark(#e4e0f2, #2e2950);
        --ink: light-dark(#1a1530, #efedfb);
        --mute: light-dark(#5f5a78, #a7a2c4);
        --inverse: light-dark(#1a1530, #efedfb);
        --inverse-ink: light-dark(#f4f2fb, #1a1530);
        --inverse-link: light-dark(#b9a9ff, #4527d6);

        /* Brand */
        --brand: light-dark(#5b3df5, #9f8cff);
        --brand-ink: light-dark(#ffffff, #12083a);
        --brand-soft: light-dark(#ece8ff, #2a2156);
        --brand-soft-ink: light-dark(#4527d6, #c9beff);
        --hero: linear-gradient(135deg, #5b3df5 0%, #a630e0 55%, #d6246a 100%);
        --hero-ink: #ffffff;

        /* Status */
        --good: light-dark(#0b7a45, #4ade80);
        --good-soft: light-dark(#e3f7ec, #12301f);
        --warn: light-dark(#a85600, #fbbf24);
        --warn-soft: light-dark(#fff1db, #33260a);
        --bad: light-dark(#c42239, #ff6b81);
        --bad-soft: light-dark(#ffe6e9, #3a1420);
        --star: light-dark(#d97706, #fbbf24);

        /* Urgency */
        --urg-0: light-dark(#e11d48, #ff5c7a);
        --urg-0-ink: light-dark(#ffffff, #2a0510);
        --urg-1: light-dark(#d97706, #fbbf24);
        --urg-2: light-dark(#0d9488, #2dd4bf);
        --urg-3: light-dark(#8a87a3, #8f8aad);

        /* Topics */
        --t-work: light-dark(#5b3df5, #9f8cff);
        --t-finance: light-dark(#16a34a, #4ade80);
        --t-shopping: light-dark(#db2777, #f472b6);
        --t-news: light-dark(#d97706, #fbbf24);
        --t-social: light-dark(#2563eb, #60a5fa);
        --t-travel: light-dark(#0891b2, #22d3ee);
        --t-other: light-dark(#8a87a3, #8f8aad);

        /* Accounts */
        --gmail-bg: light-dark(#fde8e6, #3d1a1a);
        --gmail-ink: light-dark(#b3261e, #ff9b91);
        --outlook-bg: light-dark(#e3f0fb, #10283f);
        --outlook-ink: light-dark(#0a5ca3, #8cc4ff);

        /* Type */
        --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --fs-xs: 12px; --fs-sm: 13px; --fs-md: 15px; --fs-lg: 17px; --fs-xl: 24px; --fs-2xl: 40px;

        /* Spacing, radius */
        --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
        --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-pill: 999px;

        /* Elevation, focus, motion */
        --shadow-c: light-dark(rgb(26 21 48 / .07), rgb(0 0 0 / .45));
        --shadow-1: 0 1px 2px var(--shadow-c), 0 4px 14px var(--shadow-c);
        --shadow-2: 0 6px 24px var(--shadow-c), 0 2px 6px var(--shadow-c);
        --glow: 0 8px 24px rgb(166 48 224 / .35);
        --focus: 0 0 0 3px color-mix(in srgb, var(--brand) 45%, transparent);
        --ease: 150ms ease-out;
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }

    * { box-sizing: border-box; }
    body { margin: 0; font: var(--fs-md)/1.45 var(--font); color: var(--ink); background: var(--stage); -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; cursor: pointer; transition: background var(--ease), transform var(--ease), box-shadow var(--ease), filter var(--ease); }
    button:active { transform: scale(.98); }
    :focus-visible { outline: none; box-shadow: var(--focus); }
    a { color: var(--brand); font-weight: 600; }
    input[type="checkbox"] { accent-color: var(--brand); }
    @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }

    /* Stage and dev panel */
    .stage { display: flex; gap: var(--s-5); justify-content: center; align-items: flex-start; padding: var(--s-4); }
    .dev { width: 260px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-3); font-size: var(--fs-sm); position: sticky; top: var(--s-4); max-height: calc(100vh - 32px); overflow: auto; box-shadow: var(--shadow-1); }
    .dev h2 { font-size: var(--fs-sm); margin: 0 0 6px; }
    .dev h3 { font-size: 11px; text-transform: uppercase; color: var(--mute); margin: var(--s-3) 0 var(--s-1); letter-spacing: .06em; }
    .dev button { display: block; width: 100%; text-align: left; padding: 5px 8px; margin: 2px 0; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); }
    .dev button:hover { background: var(--brand-soft); color: var(--brand-soft-ink); }
    .dev select { width: 100%; padding: 4px; margin: 2px 0; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; }
    .dev label { display: block; margin: var(--s-1) 0; }

    /* Device */
    .phone { position: relative; width: 390px; height: 800px; max-height: calc(100vh - 32px); background: var(--bg); border-radius: 32px; border: 8px solid var(--frame); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgb(26 21 48 / .25); }
    .screen { flex: 1; overflow-y: auto; padding-bottom: 96px; }

    /* Top bar, tab bar */
    .topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding: 8px 10px 8px 14px; display: flex; align-items: center; gap: var(--s-2); min-height: 60px; }
    .topbar h1 { font-size: var(--fs-lg); font-weight: 700; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar h1.brandmark { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
    .topbar h1.brandmark span { background: var(--hero); color: var(--hero-ink); border-radius: var(--r-sm); padding: 0 6px; margin-right: 6px; font-size: 16px; }
    .iconbtn { min-width: 44px; min-height: 44px; border: 0; background: none; font-size: 18px; border-radius: var(--r-md); }
    .iconbtn:hover { background: var(--surface-2); }
    .tabbar { position: absolute; bottom: 0; left: 0; right: 0; height: 64px; background: var(--surface); border-top: 1px solid var(--line); display: flex; z-index: 8; padding: 4px 6px; }
    .tabbar button { flex: 1; border: 0; background: none; font-size: var(--fs-xs); color: var(--mute); min-height: 44px; font-weight: 500; }
    .tabbar b { display: block; width: 52px; margin: 0 auto 2px; font-size: 18px; font-weight: 400; border-radius: var(--r-pill); line-height: 28px; transition: background var(--ease); }
    .tabbar button.on { color: var(--brand); font-weight: 700; }
    .tabbar button.on b { background: var(--brand-soft); color: var(--brand-soft-ink); }

    /* Layout */
    .pad { padding: var(--s-3) 14px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; margin-bottom: var(--s-3); box-shadow: var(--shadow-1); }
    .card h2, .eyebrow { font-size: var(--fs-xs); margin: 0 0 var(--s-2); color: var(--mute); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
    .num { font-variant-numeric: tabular-nums; }

    /* Hero */
    .hero { background: var(--hero); color: var(--hero-ink); border: 0; border-radius: 20px; padding: 18px; margin-bottom: var(--s-3); box-shadow: var(--glow); display: flex; align-items: center; gap: var(--s-3); width: 100%; text-align: left; }
    .hero .eyebrow { color: rgb(255 255 255 / .85); margin-bottom: 2px; }
    .hero .big { font-size: var(--fs-2xl); font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
    .hero .sub { font-size: var(--fs-sm); color: rgb(255 255 255 / .92); }
    .hero .go { margin-left: auto; width: 44px; height: 44px; border-radius: 50%; background: rgb(255 255 255 / .2); display: grid; place-items: center; font-size: 20px; flex: none; }
    .hero:hover { filter: brightness(1.05); }

    /* Rows */
    .row { display: flex; align-items: center; gap: var(--s-3); min-height: 56px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); transition: background var(--ease); }
    .row.tap { cursor: pointer; }
    .row.tap:hover { background: var(--surface-2); }
    .row.unread { box-shadow: inset 3px 0 0 var(--brand); }
    .row .main { flex: 1; min-width: 0; }
    .row .t1 { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .t2 { color: var(--mute); font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .t2.subj { color: var(--ink); font-size: 14px; }
    .row.read .t1 { font-weight: 500; color: var(--mute); }
    .row.read .t2.subj { color: var(--mute); }
    .meta { text-align: right; font-size: var(--fs-xs); color: var(--mute); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .chev { color: var(--mute); font-size: 18px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 2px; flex: none; }
    .av { width: 40px; height: 40px; border-radius: var(--r-md); display: grid; place-items: center; font-weight: 800; font-size: 16px; flex: none; background: color-mix(in srgb, var(--c) 16%, var(--surface)); color: var(--c); }

    /* Chips, badges */
    .chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: var(--r-pill); margin-right: 4px; vertical-align: middle; line-height: 18px; }
    .chip.g { background: var(--gmail-bg); color: var(--gmail-ink); }
    .chip.o { background: var(--outlook-bg); color: var(--outlook-ink); }
    .badge { background: var(--brand); color: var(--brand-ink); border-radius: var(--r-pill); min-width: 26px; padding: 1px 8px; font-size: var(--fs-xs); font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
    .badge.zero { background: var(--surface-2); color: var(--mute); }
    .badge.hot { background: var(--urg-0); color: var(--urg-0-ink); }
    .badge.star { background: var(--warn-soft); color: var(--warn); }

    /* Buttons */
    .btn { min-height: 44px; padding: 0 var(--s-4); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); font-weight: 650; }
    .btn:hover { background: var(--surface-2); }
    .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.grad { background: var(--hero); color: var(--hero-ink); border: 0; box-shadow: var(--glow); }
    .btn.grad:hover { filter: brightness(1.06); }
    .btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, var(--line)); }
    .btn.danger:hover { background: var(--bad-soft); }
    .btn.block { display: block; width: 100%; margin: var(--s-2) 0; }
    .btn.sm { min-height: 36px; padding: 0 var(--s-3); font-size: var(--fs-sm); border-radius: 10px; }
    .btn[disabled] { opacity: .55; cursor: default; box-shadow: none; }

    /* Banners, strip, progress */
    .banner { margin: 10px 14px 0; padding: var(--s-3) 14px; border-radius: var(--r-lg); font-size: 14px; }
    .banner.warn { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
    .banner.warn b { color: var(--warn); }
    .banner.info { background: var(--brand-soft); border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent); }
    .banner.info b { color: var(--brand-soft-ink); }
    .banner button { margin-top: var(--s-2); }
    .strip { background: var(--hero); color: var(--hero-ink); font-size: var(--fs-xs); font-weight: 600; padding: 5px 14px; }
    .bar { height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-pill); overflow: hidden; margin: 10px 0; }
    .bar i { display: block; height: 100%; background: var(--hero); border-radius: var(--r-pill); transition: width .2s; }
    .bar.good i { background: linear-gradient(90deg, var(--urg-2), var(--good)); }

    /* Tiles */
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .tile { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: 14px 6px 12px; text-align: center; min-height: 96px; box-shadow: var(--shadow-1); }
    .tile:hover { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
    .tile .ico { width: 36px; height: 36px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; background: color-mix(in srgb, var(--c) 16%, var(--surface)); color: var(--c); }
    .tile b { display: block; font-size: var(--fs-xl); font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .tile span { font-size: var(--fs-xs); color: var(--mute); font-weight: 600; }

    /* Floating and controls */
    .pill { position: sticky; top: 68px; z-index: 4; text-align: center; padding: 6px 0; }
    .pill button { background: var(--hero); color: var(--hero-ink); border: 0; border-radius: var(--r-pill); padding: 8px 18px; box-shadow: var(--glow); min-height: 36px; font-weight: 700; }
    .ctrl { display: flex; gap: 6px; padding: 10px 14px; overflow-x: auto; background: var(--surface); border-bottom: 1px solid var(--line); align-items: center; }
    .ctrl select, .ctrl button { min-height: 36px; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--surface-2); color: var(--ink); padding: 0 var(--s-3); font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; text-transform: capitalize; }
    .ctrl button:hover { border-color: var(--brand); }
    .ctrl .on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
    .crumb { font-size: var(--fs-xs); color: var(--mute); padding: 8px 14px 0; font-weight: 500; }
    .seg { display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 3px; gap: 2px; }
    .seg button { flex: 1; min-height: 38px; border: 0; background: none; border-radius: var(--r-pill); font-size: 14px; font-weight: 600; color: var(--mute); }
    .seg button.on { background: var(--surface); color: var(--brand); box-shadow: var(--shadow-1); }

    /* Selection, star, toast */
    .selbar { position: absolute; bottom: 72px; left: 10px; right: 10px; background: var(--inverse); color: var(--inverse-ink); display: flex; gap: var(--s-1); padding: 6px; align-items: center; z-index: 9; border-radius: var(--r-lg); box-shadow: var(--shadow-2); }
    .selbar span { flex: 1; font-size: var(--fs-sm); font-weight: 700; padding-left: var(--s-2); }
    .selbar button { min-height: 44px; border: 0; background: color-mix(in srgb, var(--inverse-ink) 12%, var(--inverse)); color: var(--inverse-ink); border-radius: 10px; padding: 0 10px; font-weight: 600; }
    .selbar button:hover { background: color-mix(in srgb, var(--inverse-ink) 22%, var(--inverse)); }
    .chk { width: 44px; height: 44px; display: grid; place-items: center; margin: -8px -6px -8px -10px; }
    .chk input { width: 20px; height: 20px; }
    .star { min-width: 44px; min-height: 44px; border: 0; background: none; font-size: 20px; color: color-mix(in srgb, var(--mute) 55%, transparent); margin: -8px -8px -8px 0; border-radius: var(--r-md); }
    .star.on { color: var(--star); }
    .star:hover { background: var(--surface-2); }
    .toast { position: absolute; left: 10px; right: 10px; bottom: 76px; z-index: 20; background: var(--inverse); color: var(--inverse-ink); border-radius: var(--r-lg); padding: 10px 14px; display: flex; gap: 10px; align-items: center; font-size: 14px; box-shadow: var(--shadow-2); animation: rise .2s ease-out; }
    .toast span { flex: 1; }
    .toast button { background: none; border: 0; color: var(--inverse-link); font-weight: 800; min-height: 36px; }
    @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* Modals */
    .modal { position: absolute; inset: 0; background: rgb(10 8 25 / .55); z-index: 30; display: flex; align-items: flex-end; }
    .modal .sheet { background: var(--surface); width: 100%; border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 10px var(--s-4) var(--s-4); box-shadow: var(--shadow-2); animation: rise .2s ease-out; }
    .modal .sheet::before { content: ""; display: block; width: 40px; height: 5px; border-radius: var(--r-pill); background: var(--line); margin: 0 auto 12px; }
    .modal.center { align-items: center; padding: 20px; }
    .modal.center .sheet { border-radius: var(--r-xl); padding-top: var(--s-4); }
    .modal.center .sheet::before { display: none; }
    .sheet h3 { margin: 0 0 6px; font-size: 18px; }
    .sheet p { color: var(--mute); margin: 6px 0 10px; }

    /* Onboarding, empty, settings */
    .center-col { padding: 36px 22px; text-align: center; }
    .center-col.plain { background: var(--surface); min-height: 100%; }
    .center-col h1 { font-size: var(--fs-xl); font-weight: 800; margin: 14px 0 6px; letter-spacing: -.01em; }
    .center-col p { color: var(--mute); }
    .logo { width: 76px; height: 76px; margin: 0 auto; border-radius: 24px; background: var(--hero); color: var(--hero-ink); display: grid; place-items: center; font-size: 38px; box-shadow: var(--glow); }
    .logo.alt { background: var(--warn-soft); color: var(--warn); box-shadow: none; }
    .logo.bad { background: var(--bad-soft); color: var(--bad); box-shadow: none; }
    .logo.provider { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); box-shadow: none; font-weight: 800; }
    .list { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-3) var(--s-4) var(--s-3) 34px; margin: 14px 0; font-size: 14px; box-shadow: var(--shadow-1); }
    .list li { margin: 5px 0; }
    .list li::marker { color: var(--good); }
    .list li.never { color: var(--bad); font-weight: 600; }
    .list li.never::marker { color: var(--bad); }
    .empty { text-align: center; padding: 56px 24px; color: var(--mute); }
    .empty .big { width: 88px; height: 88px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 42px; background: var(--brand-soft); color: var(--brand-soft-ink); }
    .empty h2 { color: var(--ink); margin: 14px 0 6px; font-size: 20px; font-weight: 800; }
    .kv { display: flex; justify-content: space-between; gap: var(--s-3); padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .kv span:last-child { color: var(--mute); text-align: right; }
    .kv:last-child { border: 0; }
    .st { font-size: var(--fs-xs); font-weight: 700; padding: 1px 8px; border-radius: var(--r-pill); white-space: nowrap; }
    .st.healthy { color: var(--good); background: var(--good-soft); }
    .st.syncing { color: var(--brand-soft-ink); background: var(--brand-soft); }
    .st.reauth { color: var(--bad); background: var(--bad-soft); }
    .tab-note { font-size: var(--fs-xs); color: var(--mute); }
    .acct-head { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; font-weight: 700; }
    .newtab { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; width: 100%; margin-top: 6px; }
    .newtab .url { background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 10px; font: 12px ui-monospace, monospace; word-break: break-all; color: var(--mute); }
    .newtab .body { padding: var(--s-4); }

    @media (max-width: 720px) {
        .stage { flex-direction: column-reverse; align-items: center; padding: 0; }
        .dev { width: 100%; position: static; max-height: none; border-radius: 0; }
        .phone { width: 100%; height: 100vh; max-height: none; border: 0; border-radius: 0; box-shadow: none; }
    }
</style>
</head>
<body>
<div class="stage">
    <aside class="dev" id="dev"></aside>
    <main class="phone" id="phone"></main>
</div>
<script>
"use strict";

// Static mock. Data is fake. State is in memory; reload resets it.

const ACCT = {
    g: { id: "g", name: "Gmail", email: "sam@gmail.com", chip: "Gmail" },
    o: { id: "o", name: "Outlook", email: "sam@contoso.com", chip: "Outlook" }
};
const TOPICS = ["Work", "Finance", "Shopping", "Newsletters", "Social", "Travel", "Other"];
const URG = ["Needs action today", "This week", "Whenever", "No urgency"];
const PAGE = 10;

// Category colors (design tokens).
const TOPIC_C = { Work: "--t-work", Finance: "--t-finance", Shopping: "--t-shopping", Newsletters: "--t-news", Social: "--t-social", Travel: "--t-travel", Other: "--t-other" };
const TOPIC_I = { Work: "💼", Finance: "💳", Shopping: "🛍", Newsletters: "📰", Social: "💬", Travel: "✈", Other: "•" };
const URG_C = ["--urg-0", "--urg-1", "--urg-2", "--urg-3"];
const SENDER_C = ["--t-work", "--t-finance", "--t-shopping", "--t-news", "--t-social", "--t-travel"];

function mk(sender, subject, mins, acct, topic, urg, unread, flag) {
    return { id: 0, sender, subject, mins, acct, topic, urg, unread, flag: !!flag, archived: false, trashed: false };
}

function seed() {
    const e = [
        mk("Dana Whitfield", "Q4 budget review: need your sign-off", 12, "o", "Work", 0, true),

const S = {
    emails: [],
    connected: [],          // account ids
    status: { g: "healthy", o: "healthy" },
    ob: { step: "signin", provider: null, returnTo: "app" },  // onboarding / connect flow, null when in app
    nav: [{ n: "home" }],
    tab: "home",
    sel: new Set(),
    sort: "newest",
    unreadOnly: false,
    acctF: "all",
    page: PAGE,
    baseline: 0,
    syncPct: 100,
    syncTotal: 31000,
    syncFail: "none",
    lastSync: 0,
    pending: [],
    simFail: false,
    toast: null,
    modal: null,
    firstRun: true,
    theme: "system"         // system | light | dark; survives demo reset
};
let syncTimer = null;
let toastTimer = null;

// ---------- Helpers ----------
const $ = (id) => document.getElementById(id);
const fmtAge = (m) => m < 60 ? m + "m" : m < 1440 ? Math.floor(m / 60) + "h" : Math.floor(m / 1440) + "d";
const chip = (a) => '<span class="chip ' + a + '">' + ACCT[a].chip + "</span>";
const chips = (set) => Array.from(set).sort().map(chip).join("");
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const cvar = (t) => "--c:var(" + t + ")";

function senderColor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return SENDER_C[h % SENDER_C.length];
}
function groupAvatar(view, key) {
    if (view === "topic") return '<span class="av" aria-hidden="true" style="' + cvar(TOPIC_C[key]) + '">' + TOPIC_I[key] + "</span>";
    if (view === "urgency") {
        const i = URG.indexOf(key);
        return '<span class="av" aria-hidden="true" style="' + cvar(URG_C[i]) + '">' + ["!", "7", "~", "–"][i] + "</span>";
    }
    return '<span class="av" aria-hidden="true" style="' + cvar(senderColor(key)) + '">' + key.charAt(0).toUpperCase() + "</span>";
}

function applyTheme() {
    if (S.theme === "system") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = S.theme;
}

function visible(e) {
    return S.connected.indexOf(e.acct) >= 0 && !e.trashed;
}
function inbox(e) {
    return visible(e) && !e.archived;
}
function inboxList() {
    return S.emails.filter(inbox);
}
function topicOf(e) { return e.topic || "Other"; }
function keyOf(view, e) {
    return view === "topic" ? topicOf(e) : view === "sender" ? e.sender : URG[e.urg];
}
function groups(view) {
    const m = new Map();
    inboxList().forEach((e) => {
        const k = keyOf(view, e);
        if (!m.has(k)) m.set(k, { key: k, total: 0, unread: 0, newest: 1e9, accts: new Set() });
        const g = m.get(k);
        g.total++;
        if (e.unread) g.unread++;
        g.newest = Math.min(g.newest, e.mins);
        g.accts.add(e.acct);
    });
    return Array.from(m.values());
}
function sortGroups(view, gs) {
    if (view === "urgency") return gs.sort((a, b) => URG.indexOf(a.key) - URG.indexOf(b.key));
    if (view === "topic") return gs.sort((a, b) => TOPICS.indexOf(a.key) - TOPICS.indexOf(b.key));
    return gs.sort((a, b) => b.total - a.total);
}
function unreadCount() { return inboxList().filter((e) => e.unread).length; }
function followList() { return S.emails.filter((e) => visible(e) && e.flag); }
function cur() { return S.nav[S.nav.length - 1]; }
function reauth() { return S.connected.filter((a) => S.status[a] === "reauth"); }

function setToast(msg, undo, retry) {
    S.toast = { msg, undo, retry };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { S.toast = null; render(); }, 7000);
}

// ---------- Actions ----------
const LABEL = { read: "Marked read", archive: "Archived", delete: "Moved to trash", follow: "Marked for follow-up", unfollow: "Follow-up removed" };

function applyOne(e, kind) {
    if (kind === "read") e.unread = false;
    if (kind === "archive") e.archived = true;
    if (kind === "delete") e.trashed = true;
    if (kind === "follow") e.flag = true;
    if (kind === "unfollow") e.flag = false;
}

function act(kind, ids) {
    const targets = S.emails.filter((e) => ids.indexOf(e.id) >= 0);
    const failed = [];
    const done = [];
    targets.forEach((e) => {
        if (S.simFail && e.acct === "o" && ids.length > 1) { failed.push(e); return; }
        done.push({ id: e.id, snap: { unread: e.unread, archived: e.archived, trashed: e.trashed, flag: e.flag } });
        applyOne(e, kind);
    });
    S.sel.clear();
    const undo = () => {
        done.forEach((d) => Object.assign(S.emails.find((x) => x.id === d.id), d.snap));
        S.toast = null;
    };
    if (failed.length) {
        const msg = LABEL[kind] + " " + done.length + " of " + targets.length + ". " + failed.length + " failed in Outlook.";
        setToast(msg, undo, () => {
            S.simFail = false;
            act(kind, failed.map((f) => f.id));
        });
    } else {
        setToast(LABEL[kind] + (targets.length > 1 ? " (" + targets.length + ")" : ""), undo);
    }
    render();
}

function openEmail(id) {
    const e = S.emails.find((x) => x.id === id);
    e.unread = false;   // write-back to provider
    const url = e.acct === "g"
        ? "https://mail.google.com/mail/u/?authuser=" + encodeURIComponent(ACCT.g.email) + "#inbox/" + (0x1a2b00 + e.id).toString(16)
        : "https://outlook.office.com/mail/id/" + (e.id + 4000) + "  (Graph webLink)";
    S.modal = { type: "newtab", e, url };
    render();
}

function refresh() {
    S.lastSync = 0;
    setToast("Synced just now");
    render();
}

function startSync() {
    clearInterval(syncTimer);
    S.syncPct = 0;
    syncTimer = setInterval(() => {
        const fail = S.syncFail;
        const cap = fail === "none" ? 100 : 45;
        if (S.syncPct >= cap) {
            clearInterval(syncTimer);
            if (fail !== "none" && S.ob) S.ob.step = "syncfail";
            if (fail === "revoked") S.status[S.ob ? S.ob.provider : "g"] = "reauth";
            render();
            return;
        }
        S.syncPct = Math.min(cap, S.syncPct + 5);
        if (S.syncPct >= 100) {
            clearInterval(syncTimer);
            finishSync();
        }
        render();
    }, 450);
}

function finishSync() {
    if (S.firstRun) {
        S.baseline = unreadCount();
        S.firstRun = false;
    }
}

function connect(provider) {
    if (S.connected.indexOf(provider) < 0) S.connected.push(provider);
    S.status[provider] = "healthy";
    S.ob.step = "sync";
    startSync();
}

function resetAll() {
    clearInterval(syncTimer);
    S.emails = seed();
    S.connected = ["g", "o"];
    S.status = { g: "healthy", o: "healthy" };
    S.ob = null;
    S.nav = [{ n: "home" }];
    S.tab = "home";
    S.sel.clear();
    S.sort = "newest"; S.unreadOnly = false; S.acctF = "all"; S.page = PAGE;
    S.syncPct = 100; S.syncFail = "none"; S.pending = []; S.simFail = false;
    S.toast = null; S.modal = null; S.lastSync = 2;
    S.firstRun = false;
    S.baseline = 38;
    $("dev").dataset.ready = "1";
}

function resetFirstRun() {
    resetAll();
    S.connected = [];
    S.ob = { step: "signin", provider: null, returnTo: "app" };
    S.firstRun = true;
    S.baseline = 0;
}

function push(n, p) {
    S.nav.push(Object.assign({ n }, p || {}));
    S.sel.clear(); S.page = PAGE; S.unreadOnly = false; S.acctF = "all";
}
function pop() {
    if (S.nav.length > 1) S.nav.pop();
    S.sel.clear(); S.page = PAGE;
}
function tab(t) {
    S.tab = t;
    S.nav = [{ n: t }];
    S.sel.clear();
}

function scrView(p) {

function emptyAll() {
    return '<div class="empty"><div class="big">🎉</div><h2>All done</h2><p>Nothing left here. Inbox clear.</p></div>';
}

function listFor(p) {
    let l = p.view === "follow" ? followList() : inboxList().filter((e) => keyOf(p.view, e) === p.key);
    if (S.acctF !== "all") l = l.filter((e) => e.acct === S.acctF);

    if (o.step === "signin") return '<div class="center-col" style="padding-top:72px"><div class="logo">🪶</div><h1>Geronimo</h1><p>One place to skim and clear your inbox.</p><button class="btn grad block" data-a="ob" data-v="connect">Sign in</button><button class="btn block" data-a="ob" data-v="connect">Create account</button></div>';
    if (o.step === "connect") return '<div class="center-col"><div class="logo">✉</div><h1>Connect your mail</h1><p>Pick one to start. You can add the other later.</p>' +
        '<button class="btn block" data-a="pre" data-v="g">' + chip("g") + "Connect Gmail</button><button class=\"btn block\" data-a=\"pre\" data-v=\"o\">" + chip("o") + "Connect Outlook</button></div>";
    if (o.step === "pre") return '<div class="center-col"><h1>Before you connect ' + pv.name + '</h1><p>Here is what Geronimo can and cannot do.</p>' +
        '<ul class="list"><li>Read the list of your emails (sender, subject, date)</li><li>Archive emails</li><li>Move emails to trash</li><li>Mark emails read and set follow-up</li><li class="never">Never permanently deletes anything</li><li class="never">Never reads message bodies</li></ul>' +
        '<button class="btn primary block" data-a="oauth">Continue to ' + pv.name + '</button><button class="btn block" data-a="obback">Back</button></div>';
    if (o.step === "oauth") return '<div class="center-col plain"><div class="logo provider">' + (o.provider === "g" ? "G" : "▦") + "</div><h1>" + pv.name + ' sign-in</h1><p>' + pv.email + '</p><div class="card" style="text-align:left">Geronimo wants to view and manage your email metadata.</div>' +
        '<button class="btn primary block" data-a="allow">Allow</button><button class="btn block" data-a="deny">Deny</button><p class="tab-note">(Provider consent screen, simulated)</p></div>';
    if (o.step === "denied") return '<div class="center-col"><div class="logo bad">🚫</div><h1>Access not granted</h1><p>Geronimo needs permission to read your email list. Nothing was connected.</p><button class="btn primary block" data-a="oauth">Try again</button><button class="btn block" data-a="ob" data-v="connect">Choose another account</button></div>';
    if (o.step === "sync") {
        const done = Math.round(S.syncTotal * S.syncPct / 100);
        return '<div class="center-col" style="padding-top:60px"><div class="logo">⟳</div><h1>Syncing ' + pv.name + '</h1><p class="num">' + done.toLocaleString() + " of " + S.syncTotal.toLocaleString() + ' emails</p><div class="bar"><i style="width:' + S.syncPct + '%"></i></div>' +
            '<button class="btn grad block" ' + (S.syncPct >= 30 ? "" : "disabled") + ' data-a="gohome">' + (S.syncPct >= 30 ? "Go to home" : "Preparing your first view…") + '</button><p class="tab-note">Sync continues in the background once you are in.</p></div>';
    }
    if (o.step === "syncfail") {
        const f = S.syncFail;
        const msg = { partial: "Some folders were skipped. 14,000 of 31,000 emails synced.", ratelimit: pv.name + " asked us to slow down. Try again in a minute.", revoked: "Access was revoked during sync. Reconnect to continue." }[f];
        return '<div class="center-col"><div class="logo alt">⚠</div><h1>Sync did not finish</h1><p>' + msg + '</p><button class="btn primary block" data-a="retrysync">' + (f === "revoked" ? "Reconnect" : "Retry") + '</button>' + (f === "partial" ? '<button class="btn block" data-a="gohome">Continue with what synced</button>' : "") + "</div>";
    }
    return "";
}

// ---------- Modals ----------
function modalHtml() {
    const m = S.modal;
    if (!m) return "";
    if (m.type === "newtab") {
        const e = m.e;
        return '<div class="modal center"><div class="sheet"><div class="eyebrow">New browser tab opens</div><div class="newtab"><div class="url">' + m.url + '</div><div class="body"><b>' + e.subject + "</b><br>" + e.sender +
            '<p class="tab-note">This is the ' + ACCT[e.acct].name + ' reader. Reply, search and read the thread here. Geronimo already marked this email read.</p></div></div>' +
            '<button class="btn primary block" data-a="closemodal" data-v="return">Return to Geronimo</button></div></div>';
    }
    if (m.type === "confirm") {
        return '<div class="modal"><div class="sheet"><h3>' + m.title + "</h3><p>" + m.text + '</p><button class="btn ' + (m.danger ? "danger" : "primary") + ' block" data-a="doconfirm">' + m.ok + '</button><button class="btn block" data-a="closemodal">Cancel</button></div></div>';
    }
    if (m.type === "group") {
        return '<div class="modal"><div class="sheet"><h3>Clear all in "' + m.key + '"</h3><p>' + m.n + " emails (" + m.unread + ' unread) across ' + m.accts + '.</p>' +
            '<button class="btn block" data-a="gact" data-v="read">Mark all read</button><button class="btn block" data-a="gact" data-v="archive">Archive all</button><button class="btn block danger" data-a="gact" data-v="delete">Move all to trash</button><button class="btn block" data-a="closemodal">Cancel</button></div></div>';
    }
    return "";
}

function toastHtml() {
    const t = S.toast;
    if (!t) return "";
    return '<div class="toast"><span>' + t.msg + "</span>" + (t.retry ? '<button data-a="retry">Retry</button>' : "") + (t.undo ? '<button data-a="undo">Undo</button>' : "") + "</div>";
}

function selBar() {
    if (!S.sel.size) return "";
    return '<div class="selbar"><span>' + S.sel.size + ' selected</span><button data-a="bulk" data-v="read">Read</button><button data-a="bulk" data-v="archive">Archive</button><button data-a="bulk" data-v="delete">Delete</button><button data-a="bulk" data-v="follow" aria-label="Follow-up">★</button></div>';
}

function tabbar() {
    const t = [["home", "⌂", "Home"], ["follow", "★", "Follow-up"], ["accounts", "☰", "Accounts"], ["settings", "⚙", "Settings"]];
    return '<nav class="tabbar">' + t.map((x) => '<button class="' + (S.tab === x[0] ? "on" : "") + '" data-a="tab" data-v="' + x[0] + '"><b>' + x[1] + "</b>" + x[2] + "</button>").join("") + "</nav>";
}

// ---------- Render ----------
function render() {
    const scrollEl = document.querySelector(".screen");
    const keep = scrollEl ? scrollEl.scrollTop : 0;
    let body;
    if (S.ob) {
        body = '<div class="screen">' + scrOnboard() + "</div>" + modalHtml();
    } else {
        const p = cur();
        let s;
        if (p.n === "home") s = scrHome();
        else if (p.n === "view") s = scrView(p);
        else if (p.n === "list") s = scrList(p);
        else if (p.n === "follow") s = scrList({ view: "follow" });
        else if (p.n === "accounts") s = scrAccounts();
        else s = scrSettings();
        body = '<div class="screen">' + s + "</div>" + selBar() + toastHtml() + tabbar() + modalHtml();
    }
    $("phone").innerHTML = body;
    const ne = document.querySelector(".screen");
    if (ne) ne.scrollTop = keep;   // preserve scroll position on updates and back
    renderDev();
}

// ---------- Dev panel ----------
function renderDev() {
    const b = (a, l) => '<button data-d="' + a + '">' + l + "</button>";
    const sel = (key, opts) => '<select data-d-sel="' + key + '">' + opts.map((x) => { const p = x.split(":"); return '<option value="' + p[0] + '"' + (S[key] === p[0] ? " selected" : "") + ">" + p[1] + "</option>"; }).join("") + "</select>";
    $("dev").innerHTML = "<h2>Geronimo mock · Phase 1</h2><div class=\"tab-note\">Static HTML, fake data. Jump to any flow or edge state.</div>" +
        "<h3>Theme</h3>" + sel("theme", ["system:System", "light:Light", "dark:Dark"]) +
        "<h3>1 First-run</h3>" + b("first", "Start first-run (sign in)") + b("pre", "Pre-consent screen") + b("sync", "Initial sync progress") +
        "<label>Sync outcome" + sel("syncFail", ["none:Succeeds", "partial:Partial sync", "ratelimit:Provider rate limit", "revoked:Token revoked mid-sync"]) + "</label>" +
        "<h3>2 Home</h3>" + b("home", "Home (unified)") +
        "<h3>3 Drill-down</h3>" + b("topic", "Topic view") + b("sender", "Sender view") + b("urgency", "Urgency view") + b("acme", "Email list: Acme Deals (mixed, paged)") +
        "<h3>4–6 Open, clear, follow-up</h3><div class=\"tab-note\">Tap a row to open. Select with checkboxes. Star to follow up.</div>" + b("follow", "Follow-up list") +
        '<label><input type="checkbox" data-d-chk="simFail"' + (S.simFail ? " checked" : "") + "> Outlook fails on next bulk action</label>" +
        "<h3>7 Freshness</h3>" + b("newmail", "Simulate 3 new emails (pill)") +
        "<h3>8 Accounts</h3>" + b("reauth", "Outlook needs re-auth") + b("accounts", "Accounts screen") +
        "<h3>9 Settings</h3>" + b("settings", "Settings & privacy") +
        "<h3>10 Edge states</h3>" + b("empty", "“All done” empty state") + b("other", "“Other” group (unclassified)") +
        "<h3>Demo</h3>" + b("reset", "Reset demo");
}

function devAction(a) {
    S.ob = S.ob && ["first", "pre", "sync"].indexOf(a) >= 0 ? S.ob : null;
    S.modal = null; S.toast = null;
    if (a === "reset") { resetAll(); }
    else if (a === "first") { resetFirstRun(); }
    else if (a === "pre") { resetFirstRun(); S.ob = { step: "pre", provider: "g", returnTo: "app" }; }
    else if (a === "sync") { resetFirstRun(); S.ob = { step: "sync", provider: "g", returnTo: "app" }; S.connected = ["g"]; startSync(); }
    else if (a === "home") { tab("home"); }
    else if (["topic", "sender", "urgency"].indexOf(a) >= 0) { tab("home"); push("view", { view: a }); }
    else if (a === "acme") { tab("home"); push("view", { view: "sender" }); push("list", { view: "sender", key: "Acme Deals" }); }
    else if (a === "follow") { tab("follow"); }
    else if (a === "newmail") {
        S.pending = [
            mk("Dana Whitfield", "Re: Q4 budget review", 0, "o", "Work", 0, true),
            mk("Delta Air Lines", "Gate change for DL 482", 0, "g", "Travel", 0, true),
            mk("GitHub", "[geronimo] PR review requested", 0, "g", "Work", 1, true)
        ];
        tab("home");
    }
    else if (a === "reauth") { S.status.o = "reauth"; tab("home"); }
    else if (a === "accounts") { tab("accounts"); }
    else if (a === "settings") { tab("settings"); }
    else if (a === "empty") { tab("home"); push("view", { view: "topic" }); push("list", { view: "topic", key: "__empty" }); }
    else if (a === "other") { tab("home"); push("view", { view: "topic" }); push("list", { view: "topic", key: "Other" }); }
    render();
}

// ---------- Events ----------
document.addEventListener("click", (ev) => {
    const d = ev.target.closest("[data-d]");
    if (d) { devAction(d.dataset.d); return; }
    const t = ev.target.closest("[data-a]");
    if (!t) return;
    const a = t.dataset.a;
    const v = t.dataset.v;
    if (a === "sel" || a === "sort") return;   // handled by change
    if (t.tagName === "A") ev.preventDefault();
    if (a === "open" && ev.target.closest("[data-stop], .star")) return;
    handle(a, v, t, ev);
});

document.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.dataset.dSel) {
        S[t.dataset.dSel] = t.value;
        if (t.dataset.dSel === "theme") { applyTheme(); render(); }
        return;
    }
    if (t.dataset.dChk) { S[t.dataset.dChk] = t.checked; return; }
    if (t.dataset.a === "sel") {
        const id = +t.dataset.id;
        if (t.checked) S.sel.add(id); else S.sel.delete(id);
        render();
    }
    if (t.dataset.a === "sort") { S.sort = t.value; render(); }
});

// List refreshes when returning from the native UI (visibilitychange in the real app).
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

function handle(a, v, t) {
    switch (a) {
        case "ob": S.ob.step = v; break;
        case "pre": S.ob.provider = v; S.ob.step = "pre"; break;
        case "obback": S.ob.step = S.firstRun ? "connect" : "__exit"; if (S.ob.step === "__exit") S.ob = null; break;
        case "oauth": S.ob.step = "oauth"; break;
        case "deny": S.ob.step = "denied"; break;
        case "allow":
            if (S.ob.returnTo === "reauth") { S.status[S.ob.provider] = "healthy"; S.ob = null; setToast("Reconnected. Syncing resumed."); }
            else connect(S.ob.provider);
            break;
        case "gohome": S.ob = null; S.nav = [{ n: "home" }]; S.tab = "home"; if (S.firstRun) { S.baseline = unreadCount(); } break;
        case "retrysync":
            if (S.syncFail === "revoked") { S.status[S.ob.provider] = "healthy"; }
            S.syncFail = "none"; S.ob.step = "sync"; startSync(); break;
        case "tab": tab(v); break;
        case "back": pop(); break;
        case "view": push("view", { view: v }); break;
        case "swap": S.nav[S.nav.length - 1] = { n: "view", view: v }; break;
        case "group": if (cur().n !== "view") push("view", { view: t.dataset.view }); push("list", { view: t.dataset.view, key: t.dataset.key }); break;
        case "unreadonly": S.unreadOnly = !S.unreadOnly; break;
        case "acctf": S.acctF = v; break;
        case "more": S.page += PAGE; break;
        case "theme": S.theme = v; applyTheme(); break;
        case "open": openEmail(+t.dataset.id); return;
        case "star": {
            const e = S.emails.find((x) => x.id === +t.dataset.id);
            act(e.flag ? "unfollow" : "follow", [e.id]);
            return;
        }
        case "bulk": act(v, Array.from(S.sel)); return;
        case "groupmenu": {
            const p = cur();
            const l = listFor(p);
            const ac = new Set(l.map((e) => e.acct));
            S.modal = { type: "group", key: p.key, n: l.length, unread: l.filter((e) => e.unread).length, accts: Array.from(ac).map((x) => ACCT[x].name).join(" + ") };
            break;
        }
        case "gact": {
            const p = cur();
            const l = listFor(p);
            const verb = { read: "Mark read", archive: "Archive", delete: "Move to trash" }[v];
            S.modal = {
                type: "confirm", title: verb + " " + l.length + " emails from " + p.key + "?",
                text: v === "delete" ? "They go to Trash. You can undo. Nothing is permanently deleted." : "You can undo this right after.",
                ok: verb + " " + l.length, danger: v === "delete", run: () => act(v, l.map((e) => e.id))
            };
            break;
        }
        case "doconfirm": { const m = S.modal; S.modal = null; m.run(); return; }
        case "closemodal": S.modal = null; if (v === "return") { setToast("Welcome back. List refreshed."); } break;
        case "undo": S.toast.undo(); break;
        case "retry": { const r = S.toast.retry; S.toast = null; r(); return; }
        case "refresh": refresh(); return;
        case "newmail":
            S.pending.forEach((e) => { e.id = S.emails.length + 1; S.emails.push(e); });
            S.pending = []; S.lastSync = 0; break;
        case "addacct": S.ob = { step: "pre", provider: v, returnTo: "app" }; break;
        case "reconnect": S.ob = { step: "oauth", provider: v, returnTo: "reauth" }; break;
        case "removeacct":
            S.modal = {
                type: "confirm", title: "Remove " + ACCT[v].name + "?", text: "Its stored data in Geronimo is deleted. Your mail in " + ACCT[v].name + " is not touched.",
                ok: "Remove account", danger: true,
                run: () => { S.connected = S.connected.filter((x) => x !== v); setToast(ACCT[v].name + " removed and its data deleted."); render(); }
            };
            break;
        case "confirm": {
            const del = v === "deldata";
            S.modal = {
                type: "confirm", title: del ? "Delete all your data?" : "Delete your Geronimo account?",
                text: del ? "All stored email metadata is erased. Accounts stay connected and will re-sync." : "Disconnects all accounts and erases everything we hold. Your mail stays in Gmail and Outlook.",
                ok: del ? "Delete my data" : "Delete my account", danger: true,
                run: () => { if (del) { setToast("All stored data deleted. Re-sync starting."); } else { resetFirstRun(); } render(); }
            };
            break;
        }
    }
    render();
}

resetAll();
applyTheme();
render();
setInterval(() => { if (!S.ob) { S.lastSync++; } }, 60000);
</script>
</body>
</html>
