<main>
{{end}}
{{define "foot"}}</main>
{{if .SignedIn}}<script>
(function () {
    function localDates(root) {
        root.querySelectorAll("time[datetime]").forEach(function (el) {
            var d = new Date(el.getAttribute("datetime"));
            if (!isNaN(d)) { el.textContent = d.toLocaleDateString(); }
        });
    }
    // Scroll offsets only, saved per page address in this tab. No mail data is stored.
    // The sender view is keyed on sort only: its address may or may not carry n (G17).
    function key() {
        if (location.pathname === "/senders") {
            return "scroll:/senders?sort=" + (new URLSearchParams(location.search).get("sort") || "total");
        }
        return "scroll:" + location.pathname + location.search;
    }
    function save() { sessionStorage.setItem(key(), String(Math.round(window.scrollY))); }
    window.addEventListener("pagehide", save);
    document.addEventListener("DOMContentLoaded", function () {
        localDates(document);
        var y = parseInt(sessionStorage.getItem(key()), 10);
        if (!isNaN(y)) { window.scrollTo(0, y); }
        var back = document.getElementById("back");
        if (back) {
            back.addEventListener("click", function (e) {
                var ref = document.referrer;
                if (ref && ref === new URL(back.getAttribute("href"), location.href).href) {
                    e.preventDefault();
                    history.back();
                }
            });
        }
    });
    document.addEventListener("htmx:afterSwap", function (e) { localDates(e.target); });
})();
</script>{{end}}
</body>
</html>
